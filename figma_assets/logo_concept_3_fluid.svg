  <g fill="none" stroke="#FF1E27" stroke-linecap="round" stroke-linejoin="round">
    <!-- Vertical stem with flame tongue -->
    <path d="M 75 140 L 75 75 C 75 55, 62 48, 70 32 C 78 46, 88 52, 88 64 L 88 140" stroke-width="6" fill="#FF1E27" />
    
    <!-- Wave curve sweeping into D belly -->
    <path d="M 60 140 C 75 125, 90 120, 105 132 C 120 144, 138 144, 150 128 C 160 115, 160 85, 142 68 C 128 55, 105 56, 88 62" stroke-width="7" />
    
    <!-- Secondary internal wave ripple -->
