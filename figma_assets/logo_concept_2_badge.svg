<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <!-- Solid Crimson Red Circular Badge Background -->
  <circle cx="100" cy="100" r="92" fill="#FF1E27" />
  
  <!-- Subtle White Concentric Ring Outline -->
  <circle cx="100" cy="100" r="84" fill="none" stroke="#FFFFFF" stroke-width="3" opacity="0.9" />
  
  <!-- Stylized Letter D: Negative Space White Icon Mark -->
  <g fill="#FFFFFF">
    <!-- Vertical Spine of D -->
    <path d="M 64 62 
             L 80 62 
             L 80 144 
             L 64 144 
             Z" />
             
    <!-- Top Flame Curve (Upper arch of D bursting into dynamic adventure flames) -->
    <path d="M 80 62
             C 80 62, 85 45, 96 34
             C 99 44, 98 50, 108 42
             C 114 36, 116 28, 120 22
             C 126 38, 124 50, 118 60
             C 132 52, 142 66, 142 82
             C 142 94, 134 102, 122 104
             C 112 106, 102 96, 96 92
             C 90 88, 80 88, 80 88
             Z" />
             
    <!-- Bottom Wave Surge (Lower arch of D sweeping into powerful Da Nang ocean waves) -->
    <path d="M 80 114
             C 88 114, 100 116, 110 112
             C 126 106, 144 116, 144 132
             C 144 146, 128 156, 106 156
             C 88 156, 80 144, 80 144
             L 80 134
             C 92 144, 112 144, 124 138
             C 132 134, 132 126, 124 122
             C 114 118, 96 124, 80 124
             Z" />

    <!-- Wave Swell Center Piece (Connecting inner energy flow) -->
    <path d="M 94 98
             C 106 98, 120 106, 120 118
             C 114 118, 102 110, 94 110
             Z" opacity="0.85" />
  </g>
</svg>
