<!-- GLOBAL HEADER COMPONENT - DANANG FOR LESS -->
<header class="w-full bg-white/95 backdrop-blur-md sticky top-0 z-50 border-b border-gray-200/80 transition-all duration-300">
  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-20 flex items-center justify-between">
    
    <!-- BRAND LOGO -->
    <!-- Logo image -->
      <a href="/" class="flex items-center group">
        <img
          src="../assets/images/logo.png"
          alt="Da Nang For Less"
          class="h-10 sm:h-11 w-auto object-contain group-hover:opacity-90 transition-opacity duration-300"
        />
      </a>

    <!-- DESKTOP NAVIGATION -->
    <nav class="hidden md:flex items-center space-x-7 lg:space-x-8 text-sm font-semibold">
      <a href="pages/tours/index.html" data-i18n="nav.tours" class="nav-link text-gray-600 hover:text-brand-crimson flex items-center gap-1.5 transition-colors">
        Tours
      </a>
      <a href="pages/stays/index.html" data-i18n="nav.hotels" class="nav-link text-gray-600 hover:text-brand-crimson flex items-center gap-1.5 transition-colors">
        Hotels & Stays
      </a>
      <a href="pages/guides/index.html" data-i18n="nav.guides" class="nav-link text-gray-600 hover:text-brand-crimson flex items-center gap-1.5 transition-colors">
        Guides
      </a>
      <a href="pages/about.html" data-i18n="nav.about" class="nav-link text-gray-600 hover:text-brand-crimson flex items-center gap-1.5 transition-colors">
        About Us
      </a>
      <a href="pages/contact.html" data-i18n="nav.contact" class="nav-link text-gray-600 hover:text-brand-crimson flex items-center gap-1.5 transition-colors">
        Contact
      </a>
      <a href="#secret-deals" data-i18n="nav.offers" class="nav-link text-gray-600 hover:text-brand-crimson flex items-center gap-1.5 transition-colors">
        Special Offers
      </a>
    </nav>

    <!-- RIGHT CONTROLS -->
    <div class="flex items-center space-x-3 sm:space-x-4">
      <!-- Multilingual Dropdown Switcher (5 Languages: VN, EN, ZH, KO, JA) -->
      <div class="lang-dropdown-container relative">
        <button type="button" class="lang-dropdown-trigger flex items-center gap-1.5 bg-gray-100/90 hover:bg-gray-200/90 px-3 py-1.5 rounded-full text-xs font-bold text-gray-700 border border-gray-200 transition shadow-sm cursor-pointer select-none">
          <i class="fa-solid fa-globe text-brand-crimson text-xs"></i>
          <span class="current-lang-text uppercase">VN</span>
          <i class="fa-solid fa-chevron-down text-[9px] text-gray-400 transition-transform"></i>
        </button>
        <div class="lang-dropdown-menu absolute right-0 mt-2 w-44 bg-white rounded-2xl shadow-xl border border-gray-100 py-1.5 hidden z-50 animate-fadeIn divide-y divide-gray-50">
          <div class="py-1">
            <button type="button" data-lang="vn" class="lang-dropdown-opt w-full text-left px-3.5 py-2 text-xs font-semibold hover:bg-red-50 hover:text-brand-crimson flex items-center justify-between transition cursor-pointer">
              <span class="flex items-center gap-2"><span>🇻🇳</span> <span>Tiếng Việt</span></span>
              <span class="text-[10px] text-gray-400 font-mono">VN</span>
            </button>
            <button type="button" data-lang="en" class="lang-dropdown-opt w-full text-left px-3.5 py-2 text-xs font-semibold hover:bg-red-50 hover:text-brand-crimson flex items-center justify-between transition cursor-pointer">
              <span class="flex items-center gap-2"><span>🇬🇧</span> <span>English</span></span>
              <span class="text-[10px] text-gray-400 font-mono">EN</span>
            </button>
            <button type="button" data-lang="zh" class="lang-dropdown-opt w-full text-left px-3.5 py-2 text-xs font-semibold hover:bg-red-50 hover:text-brand-crimson flex items-center justify-between transition cursor-pointer">
              <span class="flex items-center gap-2"><span>🇨🇳</span> <span>中文 (简体)</span></span>
              <span class="text-[10px] text-gray-400 font-mono">ZH</span>
            </button>
            <button type="button" data-lang="ko" class="lang-dropdown-opt w-full text-left px-3.5 py-2 text-xs font-semibold hover:bg-red-50 hover:text-brand-crimson flex items-center justify-between transition cursor-pointer">
              <span class="flex items-center gap-2"><span>🇰🇷</span> <span>한국어</span></span>
              <span class="text-[10px] text-gray-400 font-mono">KO</span>
            </button>
            <button type="button" data-lang="ja" class="lang-dropdown-opt w-full text-left px-3.5 py-2 text-xs font-semibold hover:bg-red-50 hover:text-brand-crimson flex items-center justify-between transition cursor-pointer">
              <span class="flex items-center gap-2"><span>🇯🇵</span> <span>日本語</span></span>
              <span class="text-[10px] text-gray-400 font-mono">JA</span>
            </button>
          </div>
        </div>
      </div>

      <!-- Dynamic Auth Container -->
      <div class="header-auth-container flex items-center space-x-2"></div>

      <!-- Mobile Hamburger Button -->
      <button id="mobile-menu-btn" class="md:hidden p-2 rounded-xl text-gray-700 hover:bg-gray-100 transition" aria-label="Mở menu">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16m-7 6h7"></path></svg>
      </button>
    </div>

  </div>
</header>
